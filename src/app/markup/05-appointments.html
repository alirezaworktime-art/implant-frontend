  <!-- appointments -->
  <section id="viewCal" class="wrap" style="padding:0" hidden>
    <div class="qhead"><h2>نوبت‌ها</h2><button class="btn" id="calNew" type="button">+ نوبت جدید</button></div>
    <div class="banner info" id="calRem" hidden></div>
    <div class="chips calmode"><button type="button" class="chip" data-cmode="week">هفتگی</button><button type="button" class="chip" data-cmode="month">ماهانه</button></div>
    <div class="calnav"><button class="btn ghost sm" id="calPrev" type="button">→ هفته‌ی قبل</button><b id="calRange"></b><button class="btn ghost sm" id="calToday" type="button">امروز</button><button class="btn ghost sm" id="calNext" type="button">هفته‌ی بعد ←</button></div>
    <div class="kleg"><span><i class="kdot k-sg"></i>جراحی</span><span><i class="kdot k-pr"></i>پروتز</span><span><i class="kdot k-ck"></i>چکاپ</span><span><i class="kdot k-fl"></i>پیگیری</span><span><i class="kdot k-ot"></i>سایر</span></div>
    <div class="days" id="calDays"></div>
    <div class="mcal" id="calMonth" hidden></div>
    <div class="qhead"><h2 id="calDayT" style="font-size:1rem"></h2></div>
    <div class="list" id="calList"><div class="empty">در حال بارگذاری…</div></div>
  </section>
