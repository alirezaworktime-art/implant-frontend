<!-- confirm sheet -->
<div class="sheet" id="cSheet" hidden>
  <div class="in">
    <h3 id="cTitle">ثبت نهایی و ارسال</h3>
    <div class="kv">
      <span>نام فایل</span><span id="cFile"></span>
      <span>ارسال به</span><span id="cTo" class="ltr"></span>
      <span>فرستنده</span><span class="ltr" id="cFrom">sender@example.com</span>
    </div>
    <div class="msg" id="cMsg"></div>
    <div class="steps" id="cSteps" hidden>
      <div class="s" id="st1"><i></i>ساخت PDF</div>
      <div class="s" id="st2"><i></i>ذخیره در بایگانی</div>
      <div class="s" id="st3"><i></i>ارسال ایمیل</div>
    </div>
    <div class="btns" id="cBtns">
      <button class="btn" id="cGo" type="button">تأیید و ارسال در پس‌زمینه</button>
      <button class="btn ghost" id="cDl" type="button">دانلود PDF</button>
      <button class="btn ghost" id="cPrint" type="button">باز کردن برای چاپ</button>
      <button class="btn ghost" id="cClose" type="button">بستن</button>
    </div>
    <div class="preview" id="cPrev"></div>
  </div>
</div>
